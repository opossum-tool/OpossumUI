name: Performance Test

on:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: '0 2 * * *'

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PERFORMANCE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: 'yarn'
          node-version-file: '.nvmrc'

      - run: yarn install --immutable

      # Cache electron-builder's download cache (electron, snap templates, AppImage
      # tools, ...) to avoid flaky re-downloads. The cache key is keyed on the
      # electron-builder version so it invalidates on upgrades.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron-builder
          key: electron-builder-ubuntu-latest-${{ hashFiles('yarn.lock', 'package.json') }}

      - name: Find previous performance baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline_run_id="$(gh run list \
            --workflow performance.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [[ -n "$baseline_run_id" ]]; then
            artifact_count="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${baseline_run_id}/artifacts?name=performance-summary" \
              --jq '[.artifacts[] | select(.expired == false)] | length')"
            if [[ "$artifact_count" == '0' ]]; then
              echo "Run $baseline_run_id has no usable performance-summary artifact; no baseline is available yet."
              baseline_run_id=''
            fi
          fi
          echo "run_id=$baseline_run_id" >> "$GITHUB_OUTPUT"
          if [[ -z "$baseline_run_id" ]]; then
            echo 'No usable previous performance summary; this run establishes the baseline.'
          else
            echo "Found previous successful performance run $baseline_run_id"
          fi

      - name: Find release performance baseline
        id: release-baseline
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          release_list_json="$(gh release list \
            --exclude-drafts \
            --limit 2 \
            --json tagName 2>/dev/null || true)"
          release_tag="$(jq -r \
            --arg current "$CURRENT_RELEASE_TAG" \
            'map(select(.tagName != $current))[0].tagName // empty' \
            <<< "$release_list_json")"
          release_run_id=''
          if [[ -n "$release_tag" ]]; then
            release_sha="$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${release_tag}" \
              --jq '.sha // empty' 2>/dev/null || true)"
            if [[ -n "$release_sha" ]]; then
              release_run_id="$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=performance-summary&per_page=100" \
                --jq "first(.artifacts[] | select(.expired == false and .workflow_run.head_sha == \"${release_sha}\") | .workflow_run.id) // empty")"
            fi
          fi
          echo "run_id=$release_run_id" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          if [[ -z "$release_run_id" ]]; then
            echo "No usable performance summary is available for release ${release_tag:-'(none found)'}."
          else
            echo "Found release $release_tag performance run $release_run_id"
          fi

      - name: Download release performance baseline
        if: steps.release-baseline.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: performance-summary
          path: performance-release-baseline
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.release-baseline.outputs.run_id }}

      - name: Download previous performance baseline
        if: steps.baseline.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: performance-summary
          path: performance-baseline
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.baseline.outputs.run_id }}

      - run: yarn ship:auto

      - run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- yarn performance:measure:large
        env:
          PERFORMANCE_BASELINE_PATH: ${{ steps.baseline.outputs.run_id != '' && 'performance-baseline/performance-summary.json' || '' }}
          PERFORMANCE_RELEASE_BASELINE_PATH: ${{ steps.release-baseline.outputs.run_id != '' && 'performance-release-baseline/performance-summary.json' || '' }}
          PERFORMANCE_RELEASE_BASELINE_LABEL: ${{ github.event_name == 'release' && 'the previous release' || 'the latest release' }}
          PERFORMANCE_RELEASE_TAG: ${{ steps.release-baseline.outputs.tag }}

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        if: failure()
        with:
          name: performance-artifacts
          path: performance-artifacts
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        if: success()
        with:
          name: performance-summary
          path: performance-artifacts/current/performance-summary.json
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'release' && 90 || 30 }}
