name: Publish release

on:
  workflow_dispatch:

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}

      - name: Prepare or recover draft release
        id: release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { default: prepareRelease } = await import(`${process.env.GITHUB_WORKSPACE}/tools/prepare-release.mjs`);
            await prepareRelease({ github, context, core });

  publish-release:
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build-command: yarn ship-linux
            manifest: release/latest-linux.yml
            FILES: |
              release/OpossumUI-for-linux.AppImage
              release/OpossumUI-for-linux.snap
          - os: macos-15-intel
            build-command: yarn ship-mac:x64
            FILES: release/mac/OpossumUI-for-mac-intel.zip
          - os: macos-latest
            build-command: yarn ship-mac:arm64
            FILES: release/mac-arm64/OpossumUI-for-mac-arm64.zip
          - os: windows-latest
            build-command: yarn ship-win
            FILES: |
              release/OpossumUI-for-win.exe
              release/OpossumUI-for-win.exe.blockmap
            manifest: release/latest.yml

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: 'yarn'
          node-version-file: '.nvmrc'

      - run: yarn install --immutable

      - name: Embed exact release tag
        shell: bash
        run: |
          jq -n --arg commitInfo "$RELEASE_TAG" '{commitInfo: $commitInfo}' > src/commitInfo.json

      - name: Configure release version and update feed
        shell: bash
        run: |
          npm pkg set "version=$RELEASE_VERSION"
          if [[ "$RUNNER_OS" != macOS ]]; then
            npm pkg set 'build.publish[0].provider=generic' 'build.publish[0].channel=latest' \
              "build.publish[0].url=https://github.com/opossum-tool/OpossumUI/releases/download/$RELEASE_TAG/"
          fi

      - run: ${{ matrix.build-command }}

      - name: Upload distributables and blockmaps
        shell: bash
        env:
          RELEASE_FILES: ${{ matrix.FILES }}
        run: |
          [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]]
          files=()
          while IFS= read -r file; do
            [[ -z "$file" ]] || files+=("$file")
          done <<< "$RELEASE_FILES"
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

      - name: Upload platform update manifest
        if: matrix.manifest
        shell: bash
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: |
          [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]]
          gh release upload "$RELEASE_TAG" "$MANIFEST" --clobber

  upload-docs:
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: 'yarn'
          node-version-file: '.nvmrc'

      - run: yarn install --immutable

      - name: Create SPDX document
        run: yarn spdx

      - name: Upload user guide and SPDX document
        run: |
          [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]]
          gh release upload "$RELEASE_TAG" USER_GUIDE.md opossum-ui.spdx.json --clobber

  publish:
    needs: [prepare, publish-release, upload-docs]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.prepare.outputs.published == 'true' ||
      (needs.publish-release.result == 'success' && needs.upload-docs.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}

      - name: Publish completed draft
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        with:
          script: |
            const { default: publishRelease } = await import(`${process.env.GITHUB_WORKSPACE}/tools/publish-release.mjs`);
            await publishRelease({ github, context, core });

  performance:
    needs: [prepare, publish]
    if: always() && needs.publish.result == 'success'
    uses: ./.github/workflows/performance.yml
    with:
      release-tag: ${{ needs.prepare.outputs.tag }}
